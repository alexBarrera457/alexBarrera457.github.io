<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e1e" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b69" />
      <stop offset="100%" stop-color="#e05a47" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#e05a47" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Monogram À. in Playfair / serif typography -->
  <!-- Accent above A -->
  <polygon points="21,11 28,14 26,17 19,13" fill="url(#coralGrad)" />

  <!-- Main 'A' letterform -->
  <path d="M 14,46 L 24,19 L 32,19 L 42,46 L 35,46 L 32.2,38 L 23.8,38 L 21,46 Z M 25.4,33 L 30.6,33 L 28,24.8 Z" fill="#fbf8f3" />

  <!-- Iconic coral dot '.' from Àlex.Barrera logo -->
  <circle cx="48" cy="42" r="4.5" fill="url(#coralGrad)" />
</svg>
